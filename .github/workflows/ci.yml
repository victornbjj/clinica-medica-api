name: CI

on:
  push:
    branches: [dev, prod, main]
  pull_request:
    branches: [dev, prod, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test -B
        env:
          JWT_SECRET: test-secret-key-with-minimum-32-characters
          JWT_EXPIRATION: 86400000
